# Local development: Valkey only. Postgres is the shared ops cluster (`ops dev db up`).
# Usage: docker compose -f docker-compose.dev.yml up -d
# For observability: cd ../signoz && docker compose -f docker-compose.dev.yml up -d

services:
  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - valkeydata:/data
    command: valkey-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  valkeydata:
