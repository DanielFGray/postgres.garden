name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun typecheck

      - name: Lint
        run: bun lint

      - name: AST rules
        run: bun ast-grep

      # The gate `bun run test` also runs `test:unit` and `test:e2e`. Both need a
      # Postgres and a Valkey this job does not start. Adding them means service
      # containers, a generated .env, and the migrations applied first.
      #
      # CI deploys nothing. The control host releases a signed-off push to its
      # repository's main, and GitHub receives each deployed commit from it.
